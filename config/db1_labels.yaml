# =============================================================================
# DATABASE 1 - the labelled set
# Aedes aegypti voltage-gated sodium channel, pyrethroid resistance
# =============================================================================
#
# Every entry here has a laboratory measurement behind it. Field frequency is
# NOT a label and is recorded separately at the bottom, under field_only.
#
# NUMBERING
#   position      = the number used in the papers (house fly / Musca domestica
#                   Vssc1, GenBank AAB47604)
#   seq_position  = the same residue in UniProt C3RTM2 (Aedes aegypti, 2140 aa),
#                   obtained by global alignment of Musca to C3RTM2 and checked
#                   against the wild-type residue and its flanking sequence.
#                   Offsets are +10 below 300, +9 at 410-435, 0 at 785-1016,
#                   +24 at 1520-1763. The offset is NOT constant - never guess it.
#
# OUTCOME VALUES  (per insecticide class)
#   resistant   - measured reduction in sensitivity
#   no_effect   - measured, and no change in sensitivity
#   not_tested  - the paper did not test this class
#   unknown     - the paper reports an effect but not which class
#
# EVIDENCE GRADES (strongest first)
#   oocyte                - site-directed mutant in a cloned mosquito channel,
#                           expressed in Xenopus oocytes, two-electrode voltage clamp
#   crispr                - change made in live mosquitoes
#   oocyte_other_species  - same method, but a different insect's channel
#   review_only           - a review states it was confirmed; primary paper not read
#
# TYPE I  = permethrin, bifenthrin, NRDC 157   (no alpha-cyano group)
# TYPE II = deltamethrin, cypermethrin, beta-cyfluthrin   (alpha-cyano group)
# =============================================================================

reference: C3RTM2_AaegL5_VGSC_wildtype      # data/vgsc_wildtype.fasta, 2140 aa
window_residues: 500                        # +/- residues around each site

# ---------------------------------------------------------------------------
# Verified position map. Every position used anywhere in databases 1, 2 and 3.
# ---------------------------------------------------------------------------
positions:
  52:   {seq: 62,   wt: R, segment: "N-terminus",      site: none}
