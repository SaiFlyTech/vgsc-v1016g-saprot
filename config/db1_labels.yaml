  827:  {seq: 827,  wt: M, segment: "IIS4 region",     site: none}
  868:  {seq: 868,  wt: N, segment: "IIS5 region",     site: none}
  918:  {seq: 918,  wt: M, segment: "IIS4-S5 linker",  site: none}
  923:  {seq: 923,  wt: G, segment: "IIS5 linker",     site: none}
  925:  {seq: 925,  wt: L, segment: "IIS5",            site: none}
  929:  {seq: 929,  wt: T, segment: "IIS5",            site: none}
  932:  {seq: 932,  wt: L, segment: "IIS5",            site: none}
  936:  {seq: 936,  wt: I, segment: "IIS5",            site: none}
  982:  {seq: 982,  wt: L, segment: "IIS5-S6",         site: none}
  989:  {seq: 989,  wt: S, segment: "IIS6",            site: none}
  1000: {seq: 1000, wt: S, segment: "IIS6",            site: none}
  1007: {seq: 1007, wt: A, segment: "IIS6",            site: PyR2}
